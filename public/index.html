const $=id=>document.getElementById(id);

let token=localStorage.getItem("pe_token")||"";

let mode="register";

let candles=[];

let chartOffset=0;

let chartDragging=false;

let chartDragStartX=0;

let chartDragStartOffset=0;

const CHART_VISIBLE_CANDLES=45;

const MARKET_REFRESH_MS=60000;

let marketLoading=false;

let lastSuccessfulUpdate=0;

/* =========================

   NAVIGATION

========================= */

document.querySelectorAll("nav button").forEach(b=>{

  b.onclick=()=>{

    document.querySelectorAll("nav button")

/* =========================

   AUTHENTICATION

========================= */

function toggleAuth(){

  mode=mode==="register"?"login":"register";

  $("authTitle").textContent=

    mode==="register"?"Create account":"Log in";

  document.querySelector(

    "#authBox .actions button:first-child"

  ).textContent=

    mode==="register"?"Create account":"Log in";

  document.querySelector(

    "#authBox .actions button:last-child"

  ).textContent=

    mode==="register"?"Use login":"Create account";

}

async function authAction(){

  const email=$("email").value.trim();

  const password=$("password").value;

  if(!email||!password){

    showAuth("Please enter your email and password.");

    return;

  }

  try{

    const r=await fetch(

      "/api/"+(mode==="register"?"register":"login"),

      {

        method:"POST",

        headers:{

          "Content-Type":"application/json"

        },

        body:JSON.stringify({email,password})

      }

    );

    const d=await r.json();

    if(!r.ok){

      showAuth(d.error||"Unable to complete request.");

      return;

    }

    token=d.token;

    localStorage.setItem("pe_token",token);

    $("authMsg").classList.add("hidden");

    updateAccount();

    loadTrades();

  }catch(e){

    showAuth(

      "Unable to connect to PriceEdge server."

    );

  }

}

function showAuth(msg){

  $("authMsg").textContent=msg;

  $("authMsg").classList.remove("hidden");

}

async function updateAccount(){

  if(!token){

    $("authBox").classList.remove("hidden");

    $("logged").classList.add("hidden");

    $("loginRequired").classList.remove("hidden");

    return;

  }

  try{

    const r=await fetch(

      "/api/me",

      {

        headers:{

          Authorization:"Bearer "+token

        }

      }

    );

    if(!r.ok){

      logout();

      return;

    }

    const d=await r.json();

    $("authBox").classList.add("hidden");

    $("logged").classList.remove("hidden");

    $("who").textContent=d.user.email;

    $("loginRequired").classList.add("hidden");

  }catch(e){

    logout();

  }

}

function logout(){

  token="";

  localStorage.removeItem("pe_token");

  updateAccount();

}

async function loadTrades(){

  if(!token)return;

  try{

    const r=await fetch(

      "/api/trades",

      {

        headers:{

          Authorization:"Bearer "+token

        }

      }

    );

    if(!r.ok)return;

    const rows=await r.json();

    $("trades").innerHTML=rows.map(t=>{

      const result=Number(t.result||0);

      return `

        <tr>

          <td>${escapeHtml(t.pair)}</td>

          <td>${escapeHtml(t.side)}</td>

          <td>${t.entry??""}</td>

          <td class="${result>=0?"green":"red"}">

            ${result>=0?"+":""}$${result.toFixed(2)}

          </td>

        </tr>

      `;

    }).join("");

  }catch(e){

    console.error("Journal error:",e);

  }

}

async function saveTrade(){

  if(!token){

    alert(

      "Please create an account or log in first."

    );

    return;

  }

  const body={

    pair:$("jp").value,

    side:$("js").value,

    entry:+$("je").value,

    stop:+$("jstop").value,

    target:+$("jt").value,

    result:+$("jr").value,

    notes:$("jn").value

  };

  try{

    const r=await fetch(

      "/api/trades",

      {

        method:"POST",

        headers:{

          "Content-Type":"application/json",

          Authorization:"Bearer "+token

        },

        body:JSON.stringify(body)

      }

    );

    if(r.ok){

      $("jn").value="";

      loadTrades();

    }else{

      const d=await r.json().catch(()=>({}));

      alert(

        d.error||

        "Could not save trade."

      );

    }

  }catch(e){

    alert(

      "Unable to connect to PriceEdge."

    );

  }

}

/* =========================

   RISK CALCULATOR

========================= */

function risk(){

  const balance=+$("bal").value;

  const riskPercent=+$("rp").value;

  const entry=+$("en").value;

  const stop=+$("sl").value;

  if(

    ![balance,riskPercent,entry,stop]

      .every(Number.isFinite)||

    balance<=0||

    riskPercent<=0||

    entry<=0||

    stop<=0

  ){

    $("riskout").textContent=

      "Please enter valid positive numbers.";

    return;

  }

  const amount=

    balance*riskPercent/100;

  const distance=

    Math.abs(entry-stop);

  $("riskout").innerHTML=`

    Maximum planned loss:

    <b>$${amount.toFixed(2)}</b>

    <br>

    Stop distance:

    <b>$${distance.toFixed(2)}</b>

    <br><br>

    <span class="muted">

      Exact XAU/USD position sizing depends on

      your broker's contract specification.

    </span>

  `;

}

/* =========================

   MATH HELPERS

========================= */

function average(values){

  if(!values.length)return 0;

  return values.reduce(

    (a,b)=>a+b,

    0

  )/values.length;

}

function clamp(value,min,max){

  return Math.max(

    min,

    Math.min(max,value)

  );

}

function findSwingHighs(data){

  const result=[];

  for(

    let i=2;

    i<data.length-2;

    i++

  ){

    if(

      data[i].high>data[i-1].high &&

      data[i].high>data[i-2].high &&

      data[i].high>=data[i+1].high &&

      data[i].high>=data[i+2].high

    ){

      result.push({

        index:i,

        price:data[i].high

      });

    }

  }

  return result;

}

function findSwingLows(data){

  const result=[];

  for(

    let i=2;

    i<data.length-2;

    i++

  ){

    if(

      data[i].low<data[i-1].low &&

      data[i].low<data[i-2].low &&

      data[i].low<=data[i+1].low &&

      data[i].low<=data[i+2].low

    ){

      result.push({

        index:i,

        price:data[i].low

      });

    }

  }

  return result;

}

/* =========================

   STRUCTURE ENGINE

========================= */

function detectStructure(data){

  if(data.length<15){

    return {

      label:"INSUFFICIENT DATA",

      bullish:false,

      bearish:false,

      score:0

    };

  }

  const d=data.slice(-40);

  const highs=findSwingHighs(d);

  const lows=findSwingLows(d);

  if(

    highs.length<2||

    lows.length<2

  ){

    return {

      label:"RANGE",

      bullish:false,

      bearish:false,

      score:0

    };

  }

  const previousHigh=

    highs[highs.length-2].price;

  const latestHigh=

    highs[highs.length-1].price;

  const previousLow=

    lows[lows.length-2].price;

  const latestLow=

    lows[lows.length-1].price;

  const higherHigh=

    latestHigh>previousHigh;

  const higherLow=

    latestLow>previousLow;

  const lowerHigh=

    latestHigh<previousHigh;

  const lowerLow=

    latestLow<previousLow;

  if(higherHigh&&higherLow){

    return {

      label:"HH / HL",

      bullish:true,

      bearish:false,

      score:2

    };

  }

  if(lowerHigh&&lowerLow){

    return {

      label:"LH / LL",

      bullish:false,

      bearish:true,

      score:2

    };

  }

  if(higherHigh){

    return {

      label:"HIGHER HIGH",

      bullish:true,

      bearish:false,

      score:1

    };

  }

  if(lowerLow){

    return {

      label:"LOWER LOW",

      bullish:false,

      bearish:true,

      score:1

    };

  }

  return {

    label:"RANGE",

    bullish:false,

    bearish:false,

    score:0

  };

}

/* =========================

   MOMENTUM ENGINE

========================= */

function calculateMomentum(data){

  const closes=data.map(c=>c.close);
  const priceDelta=latest-previous;

const priceDeltaPct=previous!==0?(priceDelta/previous)*100:0;

  const recent=closes.slice(-5);

  const previous=closes.slice(-10,-5);

  if(

    recent.length<5||

    previous.length<5

  ){

    return {

      label:"LOW",

      direction:"NEUTRAL",

      score:0,

      percent:0

    };

  }

  const recentAverage=

    average(recent);

  const previousAverage=

    average(previous);

  const change=

    recentAverage-previousAverage;

  const base=

    Math.max(

      Math.abs(previousAverage),

      0.000001

    );

  const percent=

    Math.abs(change/base)*100;

  let label="LOW";

  if(percent>=0.20){

    label="STRONG";

  }else if(percent>=0.08){

    label="MODERATE";

  }

  return {

    label,

    direction:

      change>0?

      "BULLISH":

      change<0?

      "BEARISH":

      "NEUTRAL",

    score:

      label==="STRONG"?

      2:

      label==="MODERATE"?

      1:

      0,

    percent

  };

}

/* =========================

   CANDLE STRENGTH

========================= */

function candleStrength(candle){

  const range=

    candle.high-candle.low;

  if(range<=0){

    return {

      direction:"NEUTRAL",

      strength:0

    };

  }

  const body=

    Math.abs(

      candle.close-candle.open

    );

  const bodyRatio=

    body/range;

  if(

    candle.close>candle.open

  ){

    return {

      direction:"BULLISH",

      strength:bodyRatio

    };

  }

  if(

    candle.close<candle.open

  ){

    return {

      direction:"BEARISH",

      strength:bodyRatio

    };

  }

  return {

    direction:"NEUTRAL",

    strength:0

  };

}

/* =========================

   SUPPORT / RESISTANCE

========================= */

function calculateLevels(data){

  const completed=

    data.slice(-21,-1);

  if(!completed.length){

    return {

      support:null,

      resistance:null

    };

  }

  const support=

    Math.min(

      ...completed.map(c=>c.low)

    );

  const resistance=

    Math.max(

      ...completed.map(c=>c.high)

    );

  return {

    support,

    resistance

  };

}

/* =========================

   MAIN MARKET ANALYSIS

========================= */

function buildAnalysis(data){

  if(data.length<20){

    return {

      valid:false,

      signal:"WAIT",

      message:

        "Waiting for enough candles to analyze the market."

    };

  }

  const latest=

    data[data.length-1];

  const previous=

    data[data.length-2];

  /* FIX:

     These variables were missing from the

     previous version and caused the analysis

     function to crash.

  */

  const priceDelta=

    latest.close-previous.close;

  const priceDeltaPct=

    previous.close!==0?

    (priceDelta/previous.close)*100:

    0;

  const closes=

    data.map(c=>c.close);

  const sma5=

    average(closes.slice(-5));

  const sma10=

    average(closes.slice(-10));

  const sma20=

    average(closes.slice(-20));

  let trend="SIDEWAYS";

  if(

    sma5>sma10 &&

    sma10>sma20

  ){

    trend="UPTREND";

  }else if(

    sma5<sma10 &&

    sma10<sma20

  ){

    trend="DOWNTREND";

  }

  const structure=

    detectStructure(data);

  const momentum=

    calculateMomentum(data);

  const candle=

    candleStrength(latest);

  const levels=

    calculateLevels(data);

  let bullishScore=0;

  let bearishScore=0;

  if(trend==="UPTREND")

    bullishScore+=2;

  if(trend==="DOWNTREND")

    bearishScore+=2;

  if(structure.bullish)

    bullishScore+=structure.score;

  if(structure.bearish)

    bearishScore+=structure.score;

  if(momentum.direction==="BULLISH")

    bullishScore+=momentum.score;

  if(momentum.direction==="BEARISH")

    bearishScore+=momentum.score;

  if(

    candle.direction==="BULLISH" &&

    candle.strength>=0.45

  ){

    bullishScore++;

  }

  if(

    candle.direction==="BEARISH" &&

    candle.strength>=0.45

  ){

    bearishScore++;

  }

  const totalDirectionalScore=

    Math.max(

      bullishScore,

      bearishScore

    );

  const quality=

    clamp(

      Math.round(

        totalDirectionalScore/8*100

      ),

      0,

      100

    );

  let signal="WAIT";

  if(

    bullishScore>=6 &&

    bullishScore>bearishScore &&

    structure.bullish &&

    momentum.direction!=="BEARISH"

  ){

    signal="BUY WATCH";

  }else if(

    bearishScore>=6 &&

    bearishScore>bullishScore &&

    structure.bearish &&

    momentum.direction!=="BULLISH"

  ){

    signal="SELL WATCH";

  }

  let bias="NEUTRAL";

  if(bullishScore>bearishScore)

    bias="BULLISH";

  if(bearishScore>bullishScore)

    bias="BEARISH";

  let entry=latest.close;

  let stop=null;

  let target=null;

  if(

    signal.startsWith("BUY") &&

    levels.support!==null &&

    levels.resistance!==null

  ){

    stop=levels.support;

    target=levels.resistance;

  }else if(

    signal.startsWith("SELL") &&

    levels.support!==null &&

    levels.resistance!==null

  ){

    stop=levels.resistance;

    target=levels.support;

  }else{

    stop=

      bias==="BEARISH"?

      levels.resistance:

      levels.support;

    target=

      bias==="BEARISH"?

      levels.support:

      levels.resistance;

  }

  const riskDistance=

    Number.isFinite(stop)?

    Math.abs(entry-stop):

    0;

  const rewardDistance=

    Number.isFinite(target)?

    Math.abs(target-entry):

    0;

  const rr=

    riskDistance>0?

    rewardDistance/riskDistance:

    0;

  let message=

    "Market conditions are not strong enough for a directional setup. PriceEdge is waiting for confirmation.";

  if(signal==="BUY WATCH"){

    message=

      "Bullish trend and structure are aligned. PriceEdge is watching for a pullback or confirmation before entry.";

  }else if(signal==="SELL WATCH"){

    message=

      "Bearish trend and structure are aligned. PriceEdge is watching for a retracement or confirmation before entry.";

  }

  return {

    valid:true,

    latest,

    previous,

    priceDelta,

    priceDeltaPct,

    trend,

    structure,

    momentum,

    candle,

    bias,

    signal,

    quality,

    support:levels.support,

    resistance:levels.resistance,

    entry,

    stop,

    target,

    rr,

    bullishScore,

    bearishScore,

    message

  };

}

/* =========================

   APPLY ANALYSIS TO UI

========================= */

function applyAnalysis(result){

  if(!result.valid){

    $("signalText").textContent=

      result.message;

    drawChart();

    return;

  }

  const {

    latest,

    priceDelta,

    priceDeltaPct,

    trend,

    structure,

    momentum,

    bias,

    signal,

    quality,

    support,

    resistance,

    entry,

    stop,

    target,

    rr,

    message

  }=result;

  const trendClass=

    trend==="UPTREND"?

    "green":

    trend==="DOWNTREND"?

    "red":

    "gold";

  /* PRICE */

  $("price").innerHTML=`

    $${latest.close.toFixed(2)}

    <span

      class="${trendClass}"

      style="font-size:15px"

    >

      ${trend}

    </span>

  `;

  $("priceMetaText").textContent=

    (priceDelta>0?"+":"")+

    priceDelta.toFixed(2)+

    " ("+

    (priceDeltaPct>0?"+":"")+

    priceDeltaPct.toFixed(2)+

    "%)";

  $("priceMetaText").className=

    priceDelta>0?

    "green":

    priceDelta<0?

    "red":

    "gold";

  $("priceDot").className=

    "price-dot "+

    (

      priceDelta<0?

      "down":

      priceDelta===0?

      "flat":

      ""

    );

  /* SETUP */

  setText(

    "bias",

    bias,

    trendClass

  );

  setText(

    "setupTrend",

    trend,

    trendClass

  );

  setText(

    "structure",

    structure.label

  );

  setText(

    "momentum",

    momentum.label

  );

  setText(

    "quality",

    quality+"%"

  );

  /* LEVELS */

  setText(

    "support",

    Number.isFinite(support)?

    support.toFixed(2):

    "—"

  );

  setText(

    "resistance",

    Number.isFinite(resistance)?

    resistance.toFixed(2):

    "—"

  );

  setText(

    "entryLevel",

    Number.isFinite(entry)?

    entry.toFixed(2):

    "—"

  );

  setText(

    "stopLevel",

    Number.isFinite(stop)?

    stop.toFixed(2):

    "—"

  );

  setText(

    "targetLevel",

    Number.isFinite(target)?

    target.toFixed(2):

    "—"

  );

  setText(

    "rrLevel",

    rr>0?

    "1:"+rr.toFixed(2):

    "—"

  );

  /* MARKET STATS */

  $("statSession").textContent=

    priceDelta>0?

    "Bullish move":

    priceDelta<0?

    "Bearish move":

    "Flat";

  $("statStructure").textContent=

    structure.label;

  $("statMomentum").textContent=

    momentum.label;

  $("statQuality").textContent=

    quality+"%";

  /* TREND BADGE */

  $("trendBadge").className=

    "trend-badge "+

    (

      trend==="UPTREND"?

      "bull":

      trend==="DOWNTREND"?

      "bear":

      "side"

    );

  $("trendBadge").textContent=

    trend;

  $("chartTrend").textContent=

    "TREND: "+trend;

  $("chartStructure").textContent=

    "STRUCTURE: "+structure.label;

  /* SIGNAL */

  const actionClass=

    signal.startsWith("BUY")?

    "action-buy":

    signal.startsWith("SELL")?

    "action-sell":

    "action-wait";

  $("action").className=

    "signal-action "+actionClass;

  $("action").textContent=

    signal;

  $("signalText").textContent=

    message;

  /* PRICE ACTION PAGE */

  setText(

    "aTrend",

    trend,

    trendClass

  );

  setText(

    "aStructure",

    structure.label

  );

  setText(

    "aMomentum",

    momentum.label

  );

  setText(

    "aQuality",

    quality+"%"

  );

  setText(

    "aSignal",

    signal,

    signal.startsWith("BUY")?

    "green":

    signal.startsWith("SELL")?

    "red":

    "gold"

  );

  drawChart();

}

/* =========================

   ANALYZE

========================= */

function analyze(){

  const data=

    candles

      .map(c=>({

        open:+c.open,

        high:+c.high,

        low:+c.low,

        close:+c.close,

        datetime:c.datetime

      }))

      .filter(c=>

        [

          c.open,

          c.high,

          c.low,

          c.close

        ].every(Number.isFinite)

      );

  const result=

    buildAnalysis(data);

  applyAnalysis(result);

}

/* =========================

   CHART

========================= */

function drawChart(){

  const canvas=$("chart");

  const ctx=

    canvas.getContext("2d");

  const dpr=

    window.devicePixelRatio||1;

  const w=canvas.clientWidth;

  const h=canvas.clientHeight;

  if(!w||!h)return;

  canvas.width=

    Math.floor(w*dpr);

  canvas.height=

    Math.floor(h*dpr);

  ctx.setTransform(

    dpr,0,0,dpr,0,0

  );

  ctx.clearRect(

    0,0,w,h

  );

  ctx.fillStyle="#0a1220";

  ctx.fillRect(

    0,0,w,h

  );

  if(candles.length<2){

    ctx.fillStyle="#71809c";

    ctx.font="13px system-ui";

    ctx.textAlign="center";

    ctx.fillText(

      "Waiting for market data…",

      w/2,

      h/2

    );

    return;

  }

  const visible=

    Math.min(

      CHART_VISIBLE_CANDLES,

      candles.length

    );

  const maxOffset=

    Math.max(

      0,

      candles.length-visible

    );

  chartOffset=

    Math.max(

      0,

      Math.min(

        chartOffset,

        maxOffset

      )

    );

  const end=

    candles.length-chartOffset;

  const start=

    Math.max(

      0,

      end-visible

    );

  const data=

    candles.slice(

      start,

      end

    );

  const highs=

    data.map(c=>+c.high);

  const lows=

    data.map(c=>+c.low);

  let max=Math.max(...highs);

  let min=Math.min(...lows);

  const raw=

    max-min||1;

  const pad=

    raw*.10;

  max+=pad;

  min-=pad;

  const left=13;

  const right=72;

  const top=34;

  const bottom=34;

  const cw=

    Math.max(

      1,

      w-left-right

    );

  const ch=

    Math.max(

      1,

      h-top-bottom

    );

  const range=max-min;

  const y=p=>

    top+

    (max-p)/range*ch;

  const xFor=i=>

    left+

    (i+.5)*(cw/data.length);

  const spacing=

    cw/data.length;

  const bodyWidth=

    Math.max(

      4,

      Math.min(

        13,

        spacing*.58

      )

    );

  /* GRID */

  ctx.lineWidth=1;

  for(let i=0;i<=6;i++){

    const gy=

      top+ch*i/6;

    ctx.beginPath();

    ctx.moveTo(left,gy);

    ctx.lineTo(w-right,gy);

    ctx.strokeStyle=

      i===6?

      "#1c2a42":

      "#18263d";

    ctx.stroke();

    const pv=

      max-range*i/6;

    ctx.fillStyle="#73829e";

    ctx.font="10px system-ui";

    ctx.textAlign="left";

    ctx.fillText(

      pv.toFixed(2),

      w-right+7,

      gy+3

    );

  }

  /* VERTICAL GUIDES */

  for(let i=0;i<5;i++){

    const gx=

      left+cw*i/4;

    ctx.beginPath();

    ctx.moveTo(gx,top);

    ctx.lineTo(

      gx,

      top+ch

    );

    ctx.strokeStyle="#111e33";

    ctx.stroke();

  }

  /* LEVELS */

  const completed=

    data.slice(0,-1);

  const res=

    completed.length?

    Math.max(

      ...completed.map(c=>+c.high)

    ):

    null;

  const sup=

    completed.length?

    Math.min(

      ...completed.map(c=>+c.low)

    ):

    null;

  const current=

    +data.at(-1).close;

  function line(

    p,

    label,

    value,

    color,

    dash=[6,6],

    alpha=1

  ){

    if(!Number.isFinite(p))return;

    const yy=y(p);

    if(

      yy<top-2||

      yy>top+ch+2

    )return;

    ctx.save();

    ctx.globalAlpha=alpha;

    ctx.beginPath();

    ctx.moveTo(left,yy);

    ctx.lineTo(

      w-right,

      yy

    );

    ctx.strokeStyle=color;

    ctx.lineWidth=1.2;

    ctx.setLineDash(dash);

    ctx.stroke();

    ctx.restore();

    const labelY=

      Math.max(

        top+12,

        Math.min(

          top+ch-5,

          yy-7

        )

      );

    ctx.fillStyle=color;

    ctx.font=

      "700 9px system-ui";

    ctx.textAlign="left";

    ctx.fillText(

      label.toUpperCase(),

      left+6,

      labelY

    );

    ctx.textAlign="right";

    ctx.fillText(

      Number(value).toFixed(2),

      w-right-5,

      labelY

    );

  }

  if(res!==null)

    line(

      res,

      "Resistance",

      res,

      "#8b9ab4",

      [6,6],

      .9

    );

  if(sup!==null)

    line(

      sup,

      "Support",

      sup,

      "#8b9ab4",

      [6,6],

      .9

    );

  /* TRADE LEVELS */

  const entry=

    parseFloat(

      $("entryLevel")?.textContent

    );

  const stop=

    parseFloat(

      $("stopLevel")?.textContent

    );

  const target=

    parseFloat(

      $("targetLevel")?.textContent

    );

  if(

    Number.isFinite(entry)

  ){

    line(

      entry,

      "Entry",

      entry,

      "#f5c451",

      [4,4],

      .72

    );

  }

  if(

    Number.isFinite(stop)

  ){

    line(

      stop,

      "Stop",

      stop,

      "#fb7185",

      [3,5],

      .55

    );

  }

  if(

    Number.isFinite(target)

  ){

    line(

      target,

      "Target",

      target,

      "#4ade80",

      [3,5],

      .55

    );

  }

  /* CANDLES */

  data.forEach((c,i)=>{

    const o=+c.open;

    const hi=+c.high;

    const lo=+c.low;

    const cl=+c.close;

    if(

      ![

        o,hi,lo,cl

      ].every(Number.isFinite)

    )return;

    const x=xFor(i);

    const bull=

      cl>=o;

    const bodyTop=

      y(Math.max(o,cl));

    const bodyBottom=

      y(Math.min(o,cl));

    const bodyH=

      Math.max(

        2.5,

        bodyBottom-bodyTop

      );

    const candleColor=

      bull?

      "#42e58a":

      "#ff657f";

    /* WICK */

    ctx.beginPath();

    ctx.moveTo(

      x,

      y(hi)

    );

    ctx.lineTo(

      x,

      y(lo)

    );

    ctx.strokeStyle=

      candleColor;

    ctx.lineWidth=

      Math.max(

        1.2,

        spacing*.09

      );

    ctx.stroke();

    /* BODY */

    ctx.fillStyle=

      candleColor;

    ctx.fillRect(

      x-bodyWidth/2,

      bodyTop,

      bodyWidth,

      bodyH

    );

    /* HIGHLIGHT */

    if(bodyH>6){

      ctx.fillStyle=

        bull?

        "#56efa0":

        "#ff7890";

      ctx.fillRect(

        x-bodyWidth/2+1,

        bodyTop+1,

        Math.max(

          1,

          bodyWidth-2

        ),

        1.5

      );

    }

    /* CURRENT CANDLE */

    if(

      i===data.length-1

    ){

      ctx.save();

      ctx.globalAlpha=.22;

      ctx.strokeStyle="#f5c451";

      ctx.lineWidth=1;

      ctx.strokeRect(

        x-bodyWidth/2-3,

        bodyTop-3,

        bodyWidth+6,

        bodyH+6

      );

      ctx.restore();

    }

  });

  /* CURRENT PRICE */

  const cy=y(current);

  ctx.beginPath();

  ctx.moveTo(

    left,

    cy

  );

  ctx.lineTo(

    w-right,

    cy

  );

  ctx.strokeStyle="#f5c451";

  ctx.lineWidth=1.4;

  ctx.setLineDash([7,5]);

  ctx.stroke();

  ctx.setLineDash([]);

  const pillX=

    w-right+3;

  const pillW=61;

  const pillH=20;

  const pillY=

    Math.max(

      top,

      Math.min(

        top+ch-pillH,

        cy-pillH/2

      )

    );

  ctx.fillStyle="#f5c451";

  ctx.beginPath();

  ctx.roundRect(

    pillX,

    pillY,

    pillW,

    pillH,

    6

  );

  ctx.fill();

  ctx.fillStyle="#101725";

  ctx.font=

    "800 10px system-ui";

  ctx.textAlign="center";

  ctx.fillText(

    current.toFixed(2),

    pillX+pillW/2,

    pillY+13

  );

  ctx.fillStyle="#f5c451";

  ctx.beginPath();

  ctx.arc(

    xFor(data.length-1),

    cy,

    4,

    0,

    Math.PI*2

  );

  ctx.fill();

  /* TIME LABELS */

  const labelIndexes=[

    0,

    Math.floor(

      (data.length-1)/2

    ),

    data.length-1

  ];

  ctx.fillStyle="#667795";

  ctx.font="9px system-ui";

  ctx.textAlign="center";

  labelIndexes.forEach(i=>{

    const dt=

      new Date(

        data[i].datetime

      );

    const label=

      isNaN(dt)?

      "":

      dt.toLocaleTimeString(

        [],

        {

          hour:"2-digit",

          minute:"2-digit"

        }

      );

    ctx.fillText(

      label,

      xFor(i),

      h-9

    );

  });

  /* HEADER */

  ctx.fillStyle="#71809c";

  ctx.font=

    "700 9px system-ui";

  ctx.textAlign="left";

  ctx.fillText(

    "XAU/USD · 5M",

    left,

    17

  );

  const trendText=

    $("trendBadge")?.textContent||

    "SIDEWAYS";

  ctx.textAlign="right";

  ctx.fillStyle=

    trendText==="UPTREND"?

    "#42e58a":

    trendText==="DOWNTREND"?

    "#ff657f":

    "#f5c451";

  ctx.fillText(

    trendText,

    w-right,

    17

  );

  if(chartOffset>0){

    ctx.textAlign="center";

    ctx.fillStyle="#f5c451";

    ctx.fillText(

      "HISTORY MODE · DRAG TO SCROLL",

      w/2,

      17

    );

  }

}

/* =========================

   CHART CONTROLS

========================= */

function chartOlder(){

  chartOffset=

    Math.min(

      chartOffset+10,

      Math.max(

        0,

        candles.length-

        CHART_VISIBLE_CANDLES

      )

    );

  drawChart();

}

function chartNewer(){

  chartOffset=

    Math.max(

      0,

      chartOffset-10

    );

  drawChart();

}

function chartLive(){

  chartOffset=0;

  drawChart();

}

function moveChart(delta){

  if(

    candles.length<=

    CHART_VISIBLE_CANDLES

  )return;

  const move=

    Math.max(

      1,

      Math.round(

        Math.abs(delta)/12

      )

    );

  const max=

    Math.max(

      0,

      candles.length-

      CHART_VISIBLE_CANDLES

    );

  chartOffset=

    Math.max(

      0,

      Math.min(

        chartDragStartOffset+

        (

          delta<0?

          move:

          -move

        ),

        max

      )

    );

  drawChart();

}

const chartCanvas=$("chart");

chartCanvas.addEventListener(

  "touchstart",

  e=>{

    if(!e.touches.length)return;

    chartDragging=true;

    chartDragStartX=

      e.touches[0].clientX;

    chartDragStartOffset=

      chartOffset;

  },

  {passive:true}

);

chartCanvas.addEventListener(

  "touchmove",

  e=>{

    if(

      chartDragging&&

      e.touches.length

    ){

      moveChart(

        e.touches[0].clientX-

        chartDragStartX

      );

    }

  },

  {passive:true}

);

chartCanvas.addEventListener(

  "touchend",

  ()=>{

    chartDragging=false;

  }

);

chartCanvas.addEventListener(

  "mousedown",

  e=>{

    chartDragging=true;

    chartDragStartX=e.clientX;

    chartDragStartOffset=

      chartOffset;

    chartCanvas.style.cursor=

      "grabbing";

  }

);

window.addEventListener(

  "mousemove",

  e=>{

    if(chartDragging)

      moveChart(

        e.clientX-

        chartDragStartX

      );

  }

);

window.addEventListener(

  "mouseup",

  ()=>{

    chartDragging=false;

    chartCanvas.style.cursor=

      "grab";

  }

);

chartCanvas.addEventListener(

  "dblclick",

  chartLive

);

chartCanvas.style.cursor="grab";

/* =========================

   MARKET STATUS

========================= */

function setMarketStatus(

  type,

  text

){

  $("liveStatus").className=

    "live "+

    (

      type==="cached"?

      "cached":

      type==="error"?

      "error":

      ""

    );

  $("liveStatusText")

    .textContent=text;

}

function formatUpdateTime(t){

  if(!t)

    return "Not updated yet";

  return "Updated "+

    new Date(t)

      .toLocaleTimeString(

        [],

        {

          hour:"2-digit",

          minute:"2-digit",

          second:"2-digit"

        }

      );

}

/* =========================

   LIVE MARKET DATA

========================= */

async function loadMarket(

  manual=false

){

  if(marketLoading)

    return;

  marketLoading=true;

  try{

    if(

      manual||

      !candles.length

    ){

      setMarketStatus(

        "live",

        "CONNECTING TO MARKET"

      );

      $("dataReceived")

        .textContent=

        "Requesting latest XAU/USD data…";

    }

    const response=

      await fetch(

        "/api/candles?symbol=XAU%2FUSD&interval=5min",

        {

          cache:"no-store"

        }

      );

    let d;

    try{

      d=await response.json();

    }catch(e){

      throw new Error(

        "PriceEdge received an invalid market-data response."

      );

    }

    if(!response.ok){

      throw new Error(

        d?.error||

        "Market-data request failed."

      );

    }

    if(

      !Array.isArray(d.values)||

      !d.values.length

    ){

      throw new Error(

        "No XAU/USD candle data was returned."

      );

    }

    const clean=

      d.values

        .map(c=>({

          datetime:c.datetime,

          open:+c.open,

          high:+c.high,

          low:+c.low,

          close:+c.close

        }))

        .filter(c=>

          c.datetime&&

          [

            c.open,

            c.high,

            c.low,

            c.close

          ].every(Number.isFinite)

        );

    if(!clean.length){

      throw new Error(

        "The market provider returned unusable candle data."

      );

    }

    candles=

      clean.sort(

        (a,b)=>

          new Date(a.datetime)-

          new Date(b.datetime)

      );

    chartOffset=0;

    lastSuccessfulUpdate=

      Date.now();

    $("dataReceived")

      .textContent=

      d.cached?

      "Latest valid data available":

      "Live data received";

    $("lastUpdated")

      .textContent=

      formatUpdateTime(

        d.updatedAt||

        Date.now()

      );

    if(d.cached){

      setMarketStatus(

        "cached",

        "CACHED MARKET DATA"

      );

      if(d.warning){

        $("dataReceived")

          .textContent=

          d.warning;

      }

    }else{

      setMarketStatus(

        "live",

        "LIVE MARKET DATA"

      );

    }

    analyze();

  }catch(e){

    console.error(

      "PriceEdge market error:",

      e

    );

    if(candles.length){

      setMarketStatus(

        "cached",

        "LAST VALID MARKET DATA"

      );

      $("dataReceived")

        .textContent=

        "Latest refresh failed — showing last valid data";

      $("lastUpdated")

        .textContent=

        lastSuccessfulUpdate?

        formatUpdateTime(

          lastSuccessfulUpdate

        ):

        "Previous data available";

      analyze();

    }else{

      setMarketStatus(

        "error",

        "MARKET DATA UNAVAILABLE"

      );

      $("dataReceived")

        .textContent=

        "No valid market data received";

      $("lastUpdated")

        .textContent=

        "Waiting for provider";

      $("trendBadge").className=

        "trend-badge error";

      $("trendBadge")

        .textContent=

        "DATA UNAVAILABLE";

      $("action").className=

        "signal-action action-wait";

      $("action").textContent=

        "WAIT";

      $("signalText")

        .textContent=

        e.message||

        "Market data is temporarily unavailable.";

      drawChart();

    }

  }finally{

    marketLoading=false;

  }

}

function manualRefresh(){

  loadMarket(true);

}

/* =========================

   SECURITY

========================= */

function escapeHtml(v){

  return String(v)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}

/* =========================

   START PRICEEDGE

========================= */

window.addEventListener(

  "resize",

  drawChart

);

updateAccount();

loadTrades();

loadMarket();

setInterval(

  ()=>loadMarket(false),

  MARKET_REFRESH_MS

);

</script>
