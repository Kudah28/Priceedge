<script>

/* =========================================================

   PRICEEDGE — MARKET ANALYSIS + CHART + AUTH + JOURNAL

   ========================================================= */

const $ = id => document.getElementById(id);

let token = localStorage.getItem("pe_token") || "";

let mode = "register";

let candles = [];

let chartOffset = 0;

let chartDragging = false;

let chartDragStartX = 0;

let chartDragStartOffset = 0;

const CHART_VISIBLE_CANDLES = 45;

const MARKET_REFRESH_MS = 60000;

let marketLoading = false;

let lastSuccessfulUpdate = 0;

/* =========================================================

   NAVIGATION

   ========================================================= */

document.querySelectorAll("nav button").forEach(button => {

  button.addEventListener("click", () => {

    document

      .querySelectorAll("nav button")

      .forEach(x => x.classList.remove("on"));

    button.classList.add("on");

    document

      .querySelectorAll(".page")

      .forEach(page => page.classList.remove("on"));

    const page = $(button.dataset.page);

    if (page) {

      page.classList.add("on");

    }

    if (button.dataset.page === "home") {

      setTimeout(drawChart, 50);

    }

  });

});

/* =========================================================

   AUTHENTICATION

   ========================================================= */

function toggleAuth() {

  mode = mode === "register" ? "login" : "register";

  if ($("authTitle")) {

    $("authTitle").textContent =

      mode === "register"

        ? "Create account"

        : "Log in";

  }

  const firstButton =

    document.querySelector("#authBox .actions button:first-child");

  const lastButton =

    document.querySelector("#authBox .actions button:last-child");

  if (firstButton) {

    firstButton.textContent =

      mode === "register"

        ? "Create account"

        : "Log in";

  }

  if (lastButton) {

    lastButton.textContent =

      mode === "register"

        ? "Use login"

        : "Create account";

  }

}

async function authAction() {

  const email =

    $("email")?.value.trim() || "";

  const password =

    $("password")?.value || "";

  if (!email || !password) {

    showAuth(

      "Please enter your email and password."

    );

    return;

  }

  try {

    const response = await fetch(

      "/api/" +

      (mode === "register" ? "register" : "login"),

      {

        method: "POST",

        headers: {

          "Content-Type": "application/json"

        },

        body: JSON.stringify({

          email,

          password

        })

      }

    );

    const data =

      await response.json().catch(() => ({}));

    if (!response.ok) {

      showAuth(

        data.error ||

        "Unable to complete request."

      );

      return;

    }

    token = data.token || "";

    if (!token) {

      showAuth(

        "Server did not return an authentication token."

      );

      return;

    }

    localStorage.setItem(

      "pe_token",

      token

    );

    if ($("authMsg")) {

      $("authMsg").classList.add("hidden");

    }

    await updateAccount();

    await loadTrades();

  } catch (error) {

    console.error("Authentication error:", error);

    showAuth(

      "Unable to connect to PriceEdge server."

    );

  }

}

function showAuth(message) {

  if (!$("authMsg")) return;

  $("authMsg").textContent = message;

  $("authMsg").classList.remove("hidden");

}

async function updateAccount() {

  if (!token) {

    $("authBox")?.classList.remove("hidden");

    $("logged")?.classList.add("hidden");

    $("loginRequired")?.classList.remove("hidden");

    return;

  }

  try {

    const response = await fetch(

      "/api/me",

      {

        headers: {

          Authorization: "Bearer " + token

        }

      }

    );

    if (!response.ok) {

      logout();

      return;

    }

    const data =

      await response.json();

    $("authBox")?.classList.add("hidden");

    $("logged")?.classList.remove("hidden");

    if ($("who")) {

      $("who").textContent =

        data.user?.email || "";

    }

    $("loginRequired")?.classList.add("hidden");

  } catch (error) {

    console.error("Account error:", error);

    logout();

  }

}

function logout() {

  token = "";

  localStorage.removeItem("pe_token");

  updateAccount();

}

/* =========================================================

   TRADING JOURNAL

   ========================================================= */

async function loadTrades() {

  if (!token) return;

  try {

    const response = await fetch(

      "/api/trades",

      {

        headers: {

          Authorization: "Bearer " + token

        }

      }

    );

    if (!response.ok) return;

    const rows =

      await response.json();

    if (!$("trades")) return;

    $("trades").innerHTML =

      rows.map(trade => {

        const result =

          Number(trade.result || 0);

        return `

          <tr>

            <td>${escapeHtml(trade.pair)}</td>

            <td>${escapeHtml(trade.side)}</td>

            <td>${trade.entry ?? ""}</td>

            <td class="${result >= 0 ? "green" : "red"}">

              ${result >= 0 ? "+" : ""}$${result.toFixed(2)}

            </td>

          </tr>

        `;

      }).join("");

  } catch (error) {

    console.error(

      "Journal error:",

      error

    );

  }

}

async function saveTrade() {

  if (!token) {

    alert(

      "Please create an account or log in first."

    );

    return;

  }

  const body = {

    pair: $("jp")?.value || "",

    side: $("js")?.value || "",

    entry: Number($("je")?.value || 0),

    stop: Number($("jstop")?.value || 0),

    target: Number($("jt")?.value || 0),

    result: Number($("jr")?.value || 0),

    notes: $("jn")?.value || ""

  };

  try {

    const response = await fetch(

      "/api/trades",

      {

        method: "POST",

        headers: {

          "Content-Type": "application/json",

          Authorization: "Bearer " + token

        },

        body: JSON.stringify(body)

      }

    );

    if (response.ok) {

      if ($("jn")) {

        $("jn").value = "";

      }

      await loadTrades();

    } else {

      const data =

        await response.json().catch(() => ({}));

      alert(

        data.error ||

        "Could not save trade."

      );

    }

  } catch (error) {

    console.error(

      "Save trade error:",

      error

    );

    alert(

      "Unable to connect to PriceEdge."

    );

  }

}

/* =========================================================

   RISK CALCULATOR

   ========================================================= */

function risk() {

  const balance =

    Number($("bal")?.value || 0);

  const riskPercent =

    Number($("rp")?.value || 0);

  const entry =

    Number($("en")?.value || 0);

  const stop =

    Number($("sl")?.value || 0);

  if (

    ![

      balance,

      riskPercent,

      entry,

      stop

    ].every(Number.isFinite) ||

    balance <= 0 ||

    riskPercent <= 0 ||

    entry <= 0 ||

    stop <= 0

  ) {

    if ($("riskout")) {

      $("riskout").textContent =

        "Please enter valid positive numbers.";

    }

    return;

  }

  const amount =

    balance * riskPercent / 100;

  const distance =

    Math.abs(entry - stop);

  if ($("riskout")) {

    $("riskout").innerHTML = `

      Maximum planned loss:

      <b>$${amount.toFixed(2)}</b>

      <br>

      Stop distance:

      <b>$${distance.toFixed(2)}</b>

      <br><br>

      <span class="muted">

        Exact XAU/USD position sizing depends on

        your broker's contract specification.

      </span>

    `;

  }

}

/* =========================================================

   MATH HELPERS

   ========================================================= */

function average(values) {

  if (!values.length) return 0;

  return values.reduce(

    (sum, value) => sum + value,

    0

  ) / values.length;

}

function clamp(value, min, max) {

  return Math.max(

    min,

    Math.min(max, value)

  );

}

/* =========================================================

   SWING DETECTION

   ========================================================= */

function findSwingHighs(data) {

  const result = [];

  for (let i = 2; i < data.length - 2; i++) {

    if (

      data[i].high > data[i - 1].high &&

      data[i].high > data[i - 2].high &&

      data[i].high >= data[i + 1].high &&

      data[i].high >= data[i + 2].high

    ) {

      result.push({

        index: i,

        price: data[i].high

      });

    }

  }

  return result;

}

function findSwingLows(data) {

  const result = [];

  for (let i = 2; i < data.length - 2; i++) {

    if (

      data[i].low < data[i - 1].low &&

      data[i].low < data[i - 2].low &&

      data[i].low <= data[i + 1].low &&

      data[i].low <= data[i + 2].low

    ) {

      result.push({

        index: i,

        price: data[i].low

      });

    }

  }

  return result;

}

/* =========================================================

   MARKET STRUCTURE

   ========================================================= */

function detectStructure(data) {

  if (data.length < 15) {

    return {

      label: "INSUFFICIENT DATA",

      bullish: false,

      bearish: false,

      score: 0

    };

  }

  const d =

    data.slice(-40);

  const highs =

    findSwingHighs(d);

  const lows =

    findSwingLows(d);

  if (

    highs.length < 2 ||

    lows.length < 2

  ) {

    return {

      label: "RANGE",

      bullish: false,

      bearish: false,

      score: 0

    };

  }

  const previousHigh =

    highs[highs.length - 2].price;

  const latestHigh =

    highs[highs.length - 1].price;

  const previousLow =

    lows[lows.length - 2].price;

  const latestLow =

    lows[lows.length - 1].price;

  const higherHigh =

    latestHigh > previousHigh;

  const higherLow =

    latestLow > previousLow;

  const lowerHigh =

    latestHigh < previousHigh;

  const lowerLow =

    latestLow < previousLow;

  if (higherHigh && higherLow) {

    return {

      label: "HH / HL",

      bullish: true,

      bearish: false,

      score: 2

    };

  }

  if (lowerHigh && lowerLow) {

    return {

      label: "LH / LL",

      bullish: false,

      bearish: true,

      score: 2

    };

  }

  if (higherHigh) {

    return {

      label: "HIGHER HIGH",

      bullish: true,

      bearish: false,

      score: 1

    };

  }

  if (lowerLow) {

    return {

      label: "LOWER LOW",

      bullish: false,

      bearish: true,

      score: 1

    };

  }

  return {

    label: "RANGE",

    bullish: false,

    bearish: false,

    score: 0

  };

}

/* =========================================================

   MOMENTUM ENGINE

   ========================================================= */

function calculateMomentum(data) {

  const closes =

    data.map(c => c.close);

  if (closes.length < 10) {

    return {

      label: "LOW",

      direction: "NEUTRAL",

      score: 0,

      percent: 0,

      priceDelta: 0,

      priceDeltaPct: 0

    };

  }

  /* FIXED:

     latest and previous are now defined

     BEFORE they are used.

  */

  const latest =

    closes[closes.length - 1];

  const previous =

    closes[closes.length - 2];

  const priceDelta =

    latest - previous;

  const priceDeltaPct =

    previous !== 0

      ? (priceDelta / previous) * 100

      : 0;

  const recent =

    closes.slice(-5);

  const previousWindow =

    closes.slice(-10, -5);

  const recentAverage =

    average(recent);

  const previousAverage =

    average(previousWindow);

  const change =

    recentAverage - previousAverage;

  const base =

    Math.max(

      Math.abs(previousAverage),

      0.000001

    );

  const percent =

    Math.abs(change / base) * 100;

  let label = "LOW";

  if (percent >= 0.20) {

    label = "STRONG";

  } else if (percent >= 0.08) {

    label = "MODERATE";

  }

  let direction = "NEUTRAL";

  if (change > 0) {

    direction = "BULLISH";

  } else if (change < 0) {

    direction = "BEARISH";

  }

  return {

    label,

    direction,

    score:

      label === "STRONG"

        ? 2

        : label === "MODERATE"

          ? 1

          : 0,

    percent,

    priceDelta,

    priceDeltaPct

  };

}

/* =========================================================

   CANDLE STRENGTH

   ========================================================= */

function candleStrength(candle) {

  const range =

    candle.high - candle.low;

  if (range <= 0) {

    return {

      direction: "NEUTRAL",

      strength: 0

    };

  }

  const body =

    Math.abs(

      candle.close - candle.open

    );

  const bodyRatio =

    body / range;

  if (candle.close > candle.open) {

    return {

      direction: "BULLISH",

      strength: bodyRatio

    };

  }

  if (candle.close < candle.open) {

    return {

      direction: "BEARISH",

      strength: bodyRatio

    };

  }

  return {

    direction: "NEUTRAL",

    strength: 0

  };

}

/* =========================================================

   SUPPORT / RESISTANCE

   ========================================================= */

function calculateLevels(data) {

  const completed =

    data.slice(-21, -1);

  if (!completed.length) {

    return {

      support: null,

      resistance: null

    };

  }

  const support =

    Math.min(

      ...completed.map(c => c.low)

    );

  const resistance =

    Math.max(

      ...completed.map(c => c.high)

    );

  return {

    support,

    resistance

  };

}

/* =========================================================

   MAIN ANALYSIS

   ========================================================= */

function buildAnalysis(data) {

  if (data.length < 20) {

    return {

      valid: false,

      signal: "WAIT",

      message:

        "Waiting for enough candles to analyze the market."

    };

  }

  const latest =

    data[data.length - 1];

  const previous =

    data[data.length - 2];

  const priceDelta =

    latest.close - previous.close;

  const priceDeltaPct =

    previous.close !== 0

      ? (priceDelta / previous.close) * 100

      : 0;

  const closes =

    data.map(c => c.close);

  const sma5 =

    average(closes.slice(-5));

  const sma10 =

    average(closes.slice(-10));

  const sma20 =

    average(closes.slice(-20));

  let trend = "SIDEWAYS";

  if (

    sma5 > sma10 &&

    sma10 > sma20

  ) {

    trend = "UPTREND";

  } else if (

    sma5 < sma10 &&

    sma10 < sma20

  ) {

    trend = "DOWNTREND";

  }

  const structure =

    detectStructure(data);

  const momentum =

    calculateMomentum(data);

  const candle =

    candleStrength(latest);

  const levels =

    calculateLevels(data);

  let bullishScore = 0;

  let bearishScore = 0;

  if (trend === "UPTREND") {

    bullishScore += 2;

  }

  if (trend === "DOWNTREND") {

    bearishScore += 2;

  }

  if (structure.bullish) {

    bullishScore += structure.score;

  }

  if (structure.bearish) {

    bearishScore += structure.score;

  }

  if (momentum.direction === "BULLISH") {

    bullishScore += momentum.score;

  }

  if (momentum.direction === "BEARISH") {

    bearishScore += momentum.score;

  }

  if (

    candle.direction === "BULLISH" &&

    candle.strength >= 0.45

  ) {

    bullishScore++;

  }

  if (

    candle.direction === "BEARISH" &&

    candle.strength >= 0.45

  ) {

    bearishScore++;

  }

  const totalDirectionalScore =

    Math.max(

      bullishScore,

      bearishScore

    );

  const quality =

    clamp(

      Math.round(

        totalDirectionalScore / 8 * 100

      ),

      0,

      100

    );

  let signal = "WAIT";

  if (

    bullishScore >= 6 &&

    bullishScore > bearishScore &&

    structure.bullish &&

    momentum.direction !== "BEARISH"

  ) {

    signal = "BUY WATCH";

  } else if (

    bearishScore >= 6 &&

    bearishScore > bullishScore &&

    structure.bearish &&

    momentum.direction !== "BULLISH"

  ) {

    signal = "SELL WATCH";

  }

  let bias = "NEUTRAL";

  if (bullishScore > bearishScore) {

    bias = "BULLISH";

  }

  if (bearishScore > bullishScore) {

    bias = "BEARISH";

  }

  const entry =

    latest.close;

  let stop = null;

  let target = null;

  if (

    signal.startsWith("BUY") &&

    levels.support !== null &&

    levels.resistance !== null

  ) {

    stop = levels.support;

    target = levels.resistance;

  } else if (

    signal.startsWith("SELL") &&

    levels.support !== null &&

    levels.resistance !== null

  ) {

    stop = levels.resistance;

    target = levels.support;

  } else {

    stop =

      bias === "BEARISH"

        ? levels.resistance

        : levels.support;

    target =

      bias === "BEARISH"

        ? levels.support

        : levels.resistance;

  }

  const riskDistance =

    Number.isFinite(stop)

      ? Math.abs(entry - stop)

      : 0;

  const rewardDistance =

    Number.isFinite(target)

      ? Math.abs(target - entry)

      : 0;

  const rr =

    riskDistance > 0

      ? rewardDistance / riskDistance

      : 0;

  let message =

    "Market conditions are not strong enough for a directional setup. PriceEdge is waiting for confirmation.";

  if (signal === "BUY WATCH") {

    message =

      "Bullish trend and structure are aligned. PriceEdge is watching for a pullback or confirmation before entry.";

  } else if (signal === "SELL WATCH") {

    message =

      "Bearish trend and structure are aligned. PriceEdge is watching for a retracement or confirmation before entry.";

  }

  return {

    valid: true,

    latest,

    previous,

    priceDelta,

    priceDeltaPct,

    trend,

    structure,

    momentum,

    candle,

    bias,

    signal,

    quality,

    support: levels.support,

    resistance: levels.resistance,

    entry,

    stop,

    target,

    rr,

    bullishScore,

    bearishScore,

    message

  };

}

/* =========================================================

   UI HELPERS

   ========================================================= */

function setText(id, value, cls = "") {

  const element = $(id);

  if (!element) return;

  element.textContent = value;

  if (cls) {

    element.className = cls;

  }

}

/* =========================================================

   APPLY ANALYSIS

   ========================================================= */

function applyAnalysis(result) {

  if (!result.valid) {

    if ($("signalText")) {

      $("signalText").textContent =

        result.message;

    }

    drawChart();

    return;

  }

  const {

    latest,

    priceDelta,

    priceDeltaPct,

    trend,

    structure,

    momentum,

    bias,

    signal,

    quality,

    support,

    resistance,

    entry,

    stop,

    target,

    rr,

    message

  } = result;

  const trendClass =

    trend === "UPTREND"

      ? "green"

      : trend === "DOWNTREND"

        ? "red"

        : "gold";

  /* PRICE */

  if ($("price")) {

    $("price").innerHTML = `

      $${latest.close.toFixed(2)}

      <span

        class="${trendClass}"

        style="font-size:15px"

      >

        ${trend}

      </span>

    `;

  }

  if ($("priceMetaText")) {

    $("priceMetaText").textContent =

      (priceDelta > 0 ? "+" : "") +

      priceDelta.toFixed(2) +

      " (" +

      (priceDeltaPct > 0 ? "+" : "") +

      priceDeltaPct.toFixed(2) +

      "%)";

    $("priceMetaText").className =

      priceDelta > 0

        ? "green"

        : priceDelta < 0

          ? "red"

          : "gold";

  }

  if ($("priceDot")) {

    $("priceDot").className =

      "price-dot " +

      (

        priceDelta < 0

          ? "down"

          : priceDelta === 0

            ? "flat"

            : ""

      );

  }

  /* SETUP */

  setText("bias", bias, trendClass);

  setText("setupTrend", trend, trendClass);

  setText("structure", structure.label);

  setText("momentum", momentum.label);

  setText("quality", quality + "%");

  /* LEVELS */

  setText(

    "support",

    Number.isFinite(support)

      ? support.toFixed(2)

      : "—"

  );

  setText(

    "resistance",

    Number.isFinite(resistance)

      ? resistance.toFixed(2)

      : "—"

  );

  setText(

    "entryLevel",

    Number.isFinite(entry)

      ? entry.toFixed(2)

      : "—"

  );

  setText(

    "stopLevel",

    Number.isFinite(stop)

      ? stop.toFixed(2)

      : "—"

  );

  setText(

    "targetLevel",

    Number.isFinite(target)

      ? target.toFixed(2)

      : "—"

  );

  setText(

    "rrLevel",

    rr > 0

      ? "1:" + rr.toFixed(2)

      : "—"

  );

  /* MARKET STATS */

  if ($("statSession")) {

    $("statSession").textContent =

      priceDelta > 0

        ? "Bullish move"

        : priceDelta < 0

          ? "Bearish move"

          : "Flat";

  }

  setText(

    "statStructure",

    structure.label

  );

  setText(

    "statMomentum",

    momentum.label

  );

  setText(

    "statQuality",

    quality + "%"

  );

  /* TREND BADGE */

  if ($("trendBadge")) {

    $("trendBadge").className =

      "trend-badge " +

      (

        trend === "UPTREND"

          ? "bull"

          : trend === "DOWNTREND"

            ? "bear"

            : "side"

      );

    $("trendBadge").textContent =

      trend;

  }

  setText(

    "chartTrend",

    "TREND: " + trend

  );

  setText(

    "chartStructure",

    "STRUCTURE: " + structure.label

  );

  /* SIGNAL */

  const actionClass =

    signal.startsWith("BUY")

      ? "action-buy"

      : signal.startsWith("SELL")

        ? "action-sell"

        : "action-wait";

  if ($("action")) {

    $("action").className =

      "signal-action " + actionClass;

    $("action").textContent =

      signal;

  }

  if ($("signalText")) {

    $("signalText").textContent =

      message;

  }

  /* PRICE ACTION PAGE */

  setText(

    "aTrend",

    trend,

    trendClass

  );

  setText(

    "aStructure",

    structure.label

  );

  setText(

    "aMomentum",

    momentum.label

  );

  setText(

    "aQuality",

    quality + "%"

  );

  setText(

    "aSignal",

    signal,

    signal.startsWith("BUY")

      ? "green"

      : signal.startsWith("SELL")

        ? "red"

        : "gold"

  );

  drawChart();

}

/* =========================================================

   ANALYZE

   ========================================================= */

function analyze() {

  const data =

    candles

      .map(c => ({

        open: Number(c.open),

        high: Number(c.high),

        low: Number(c.low),

        close: Number(c.close),

        datetime: c.datetime

      }))

      .filter(c =>

        [

          c.open,

          c.high,

          c.low,

          c.close

        ].every(Number.isFinite)

      );

  const result =

    buildAnalysis(data);

  applyAnalysis(result);

}

/* =========================================================

   CHART

   ========================================================= */

function drawChart() {

  const canvas = $("chart");

  if (!canvas) return;

  const ctx =

    canvas.getContext("2d");

  if (!ctx) return;

  const dpr =

    window.devicePixelRatio || 1;

  const w =

    canvas.clientWidth;

  const h =

    canvas.clientHeight;

  if (!w || !h) return;

  canvas.width =

    Math.floor(w * dpr);

  canvas.height =

    Math.floor(h * dpr);

  ctx.setTransform(

    dpr,

    0,

    0,

    dpr,

    0,

    0

  );

  ctx.clearRect(

    0,

    0,

    w,

    h

  );

  ctx.fillStyle =

    "#0a1220";

  ctx.fillRect(

    0,

    0,

    w,

    h

  );

  if (candles.length < 2) {

    ctx.fillStyle =

      "#71809c";

    ctx.font =

      "13px system-ui";

    ctx.textAlign =

      "center";

    ctx.fillText(

      "Waiting for market data…",

      w / 2,

      h / 2

    );

    return;

  }

  const visible =

    Math.min(

      CHART_VISIBLE_CANDLES,

      candles.length

    );

  const maxOffset =

    Math.max(

      0,

      candles.length - visible

    );

  chartOffset =

    Math.max(

      0,

      Math.min(

        chartOffset,

        maxOffset

      )

    );

  const end =

    candles.length - chartOffset;

  const start =

    Math.max(

      0,

      end - visible

    );

  const data =

    candles.slice(

      start,

      end

    );

  const highs =

    data.map(c => Number(c.high));

  const lows =

    data.map(c => Number(c.low));

  let max =

    Math.max(...highs);

  let min =

    Math.min(...lows);

  const raw =

    max - min || 1;

  const pad =

    raw * 0.10;

  max += pad;

  min -= pad;

  const left = 13;

  const right = 72;

  const top = 34;

  const bottom = 34;

  const cw =

    Math.max(

      1,

      w - left - right

    );

  const ch =

    Math.max(

      1,

      h - top - bottom

    );

  const range =

    max - min;

  const y = price =>

    top +

    ((max - price) / range) * ch;

  const xFor = index =>

    left +

    (index + 0.5) *

    (cw / data.length);

  const spacing =

    cw / data.length;

  const bodyWidth =

    Math.max(

      4,

      Math.min(

        13,

        spacing * 0.58

      )

    );

  /* GRID */

  ctx.lineWidth = 1;

  for (let i = 0; i <= 6; i++) {

    const gy =

      top + ch * i / 6;

    ctx.beginPath();

    ctx.moveTo(

      left,

      gy

    );

    ctx.lineTo(

      w - right,

      gy

    );

    ctx.strokeStyle =

      i === 6

        ? "#1c2a42"

        : "#18263d";

    ctx.stroke();

    const price =

      max - range * i / 6;

    ctx.fillStyle =

      "#73829e";

    ctx.font =

      "10px system-ui";

    ctx.textAlign =

      "left";

    ctx.fillText(

      price.toFixed(2),

      w - right + 7,

      gy + 3

    );

  }

  /* VERTICAL GUIDES */

  for (let i = 0; i < 5; i++) {

    const gx =

      left + cw * i / 4;

    ctx.beginPath();

    ctx.moveTo(

      gx,

      top

    );

    ctx.lineTo(

      gx,

      top + ch

    );

    ctx.strokeStyle =

      "#111e33";

    ctx.stroke();

  }

  /* LEVEL DRAWER */

  function line(

    price,

    label,

    value,

    color,

    dash = [6, 6],

    alpha = 1

  ) {

    if (!Number.isFinite(price)) {

      return;

    }

    const yy =

      y(price);

    if (

      yy < top - 2 ||

      yy > top + ch + 2

    ) {

      return;

    }

    ctx.save();

    ctx.globalAlpha =

      alpha;

    ctx.beginPath();

    ctx.moveTo(

      left,

      yy

    );

    ctx.lineTo(

      w - right,

      yy

    );

    ctx.strokeStyle =

      color;

    ctx.lineWidth =

      1.2;

    ctx.setLineDash(

      dash

    );

    ctx.stroke();

    ctx.restore();

    const labelY =

      Math.max(

        top + 12,

        Math.min(

          top + ch - 5,

          yy - 7

        )

      );

    ctx.fillStyle =

      color;

    ctx.font =

      "700 9px system-ui";

    ctx.textAlign =

      "left";

    ctx.fillText(

      label.toUpperCase(),

      left + 6,

      labelY

    );

    ctx.textAlign =

      "right";

    ctx.fillText(

      Number(value).toFixed(2),

      w - right - 5,

      labelY

    );

  }

  /* SUPPORT / RESISTANCE */

  const completed =

    data.slice(0, -1);

  const resistance =

    completed.length

      ? Math.max(

          ...completed.map(

            c => Number(c.high)

          )

        )

      : null;

  const support =

    completed.length

      ? Math.min(

          ...completed.map(

            c => Number(c.low)

          )

        )

      : null;

  if (resistance !== null) {

    line(

      resistance,

      "Resistance",

      resistance,

      "#8b9ab4",

      [6, 6],

      0.9

    );

  }

  if (support !== null) {

    line(

      support,

      "Support",

      support,

      "#8b9ab4",

      [6, 6],

      0.9

    );

  }

  /* TRADE LEVELS */

  const entry =

    parseFloat(

      $("entryLevel")?.textContent

    );

  const stop =

    parseFloat(

      $("stopLevel")?.textContent

    );

  const target =

    parseFloat(

      $("targetLevel")?.textContent

    );

  if (Number.isFinite(entry)) {

    line(

      entry,

      "Entry",

      entry,

      "#f5c451",

      [4, 4],

      0.72

    );

  }

  if (Number.isFinite(stop)) {

    line(

      stop,

      "Stop",

      stop,

      "#fb7185",

      [3, 5],

      0.55

    );

  }

  if (Number.isFinite(target)) {

    line(

      target,

      "Target",

      target,

      "#4ade80",

      [3, 5],

      0.55

    );

  }

  /* CANDLES */

  data.forEach((candle, index) => {

    const open =

      Number(candle.open);

    const high =

      Number(candle.high);

    const low =

      Number(candle.low);

    const close =

      Number(candle.close);

    if (

      ![

        open,

        high,

        low,

        close

      ].every(Number.isFinite)

    ) {

      return;

    }

    const x =

      xFor(index);

    const bullish =

      close >= open;

    const bodyTop =

      y(Math.max(open, close));

    const bodyBottom =

      y(Math.min(open, close));

    const bodyHeight =

      Math.max(

        2.5,

        bodyBottom - bodyTop

      );

    const candleColor =

      bullish

        ? "#42e58a"

        : "#ff657f";

    /* WICK */

    ctx.beginPath();

    ctx.moveTo(

      x,

      y(high)

    );

    ctx.lineTo(

      x,

      y(low)

    );

    ctx.strokeStyle =

      candleColor;

    ctx.lineWidth =

      Math.max(

        1.2,

        spacing * 0.09

      );

    ctx.stroke();

    /* BODY */

    ctx.fillStyle =

      candleColor;

    ctx.fillRect(

      x - bodyWidth / 2,

      bodyTop,

      bodyWidth,

      bodyHeight

    );

    /* BODY HIGHLIGHT */

    if (bodyHeight > 6) {

      ctx.fillStyle =

        bullish

          ? "#56efa0"

          : "#ff7890";

      ctx.fillRect(

        x - bodyWidth / 2 + 1,

        bodyTop + 1,

        Math.max(

          1,

          bodyWidth - 2

        ),

        1.5

      );

    }

    /* CURRENT CANDLE */

    if (

      index === data.length - 1

    ) {

      ctx.save();

      ctx.globalAlpha =

        0.22;

      ctx.strokeStyle =

        "#f5c451";

      ctx.lineWidth =

        1;

      ctx.strokeRect(

        x - bodyWidth / 2 - 3,

        bodyTop - 3,

        bodyWidth + 6,

        bodyHeight + 6

      );

      ctx.restore();

    }

  });

  /* CURRENT PRICE */

  const current =

    Number(

      data[data.length - 1].close

    );

  const currentY =

    y(current);

  ctx.beginPath();

  ctx.moveTo(

    left,

    currentY

  );

  ctx.lineTo(

    w - right,

    currentY

  );

  ctx.strokeStyle =

    "#f5c451";

  ctx.lineWidth =

    1.4;

  ctx.setLineDash(

    [7, 5]

  );

  ctx.stroke();

  ctx.setLineDash([]);

  /* PRICE PILL */

  const pillX =

    w - right + 3;

  const pillW = 61;

  const pillH = 20;

  const pillY =

    Math.max(

      top,

      Math.min(

        top + ch - pillH,

        currentY - pillH / 2

      )

    );

  ctx.fillStyle =

    "#f5c451";

  ctx.beginPath();

  if (ctx.roundRect) {

    ctx.roundRect(

      pillX,

      pillY,

      pillW,

      pillH,

      6

    );

  } else {

    ctx.rect(

      pillX,

      pillY,

      pillW,

      pillH

    );

  }

  ctx.fill();

  ctx.fillStyle =

    "#101725";

  ctx.font =

    "800 10px system-ui";

  ctx.textAlign =

    "center";

  ctx.fillText(

    current.toFixed(2),

    pillX + pillW / 2,

    pillY + 13

  );

  /* CURRENT PRICE DOT */

  ctx.fillStyle =

    "#f5c451";

  ctx.beginPath();

  ctx.arc(

    xFor(data.length - 1),

    currentY,

    4,

    0,

    Math.PI * 2

  );

  ctx.fill();

  /* TIME LABELS */

  const labelIndexes = [

    0,

    Math.floor(

      (data.length - 1) / 2

    ),

    data.length - 1

  ];

  ctx.fillStyle =

    "#667795";

  ctx.font =

    "9px system-ui";

  ctx.textAlign =

    "center";

  labelIndexes.forEach(index => {

    const date =

      new Date(

        data[index].datetime

      );

    const label =

      isNaN(date.getTime())

        ? ""

        : date.toLocaleTimeString(

            [],

            {

              hour: "2-digit",

              minute: "2-digit"

            }

          );

    ctx.fillText(

      label,

      xFor(index),

      h - 9

    );

  });

  /* CHART HEADER */

  ctx.fillStyle =

    "#71809c";

  ctx.font =

    "700 9px system-ui";

  ctx.textAlign =

    "left";

  ctx.fillText(

    "XAU/USD · 5M",

    left,

    17

  );

  const trendText =

    $("trendBadge")?.textContent ||

    "SIDEWAYS";

  ctx.textAlign =

    "right";

  ctx.fillStyle =

    trendText === "UPTREND"

      ? "#42e58a"

      : trendText === "DOWNTREND"

        ? "#ff657f"

        : "#f5c451";

  ctx.fillText(

    trendText,

    w - right,

    17

  );

  /* HISTORY MODE */

  if (chartOffset > 0) {

    ctx.textAlign =

      "center";

    ctx.fillStyle =

      "#f5c451";

    ctx.fillText(

      "HISTORY MODE · DRAG TO SCROLL",

      w / 2,

      17

    );

  }

}

/* =========================================================

   CHART CONTROLS

   ========================================================= */

function chartOlder() {

  chartOffset =

    Math.min(

      chartOffset + 10,

      Math.max(

        0,

        candles.length -

        CHART_VISIBLE_CANDLES

      )

    );

  drawChart();

}

function chartNewer() {

  chartOffset =

    Math.max(

      0,

      chartOffset - 10

    );

  drawChart();

}

function chartLive() {

  chartOffset = 0;

  drawChart();

}

function moveChart(delta) {

  if (

    candles.length <=

    CHART_VISIBLE_CANDLES

  ) {

    return;

  }

  const move =

    Math.max(

      1,

      Math.round(

        Math.abs(delta) / 12

      )

    );

  const max =

    Math.max(

      0,

      candles.length -

      CHART_VISIBLE_CANDLES

    );

  chartOffset =

    Math.max(

      0,

      Math.min(

        chartDragStartOffset +

        (

          delta < 0

            ? move

            : -move

        ),

        max

      )

    );

  drawChart();

}

/* =========================================================

   CHART TOUCH / MOUSE

   ========================================================= */

const chartCanvas =

  $("chart");

if (chartCanvas) {

  chartCanvas.addEventListener(

    "touchstart",

    event => {

      if (!event.touches.length) {

        return;

      }

      chartDragging = true;

      chartDragStartX =

        event.touches[0].clientX;

      chartDragStartOffset =

        chartOffset;

    },

    {

      passive: true

    }

  );

  chartCanvas.addEventListener(

    "touchmove",

    event => {

      if (

        chartDragging &&

        event.touches.length

      ) {

        moveChart(

          event.touches[0].clientX -

          chartDragStartX

        );

      }

    },

    {

      passive: true

    }

  );

  chartCanvas.addEventListener(

    "touchend",

    () => {

      chartDragging = false;

    }

  );

  chartCanvas.addEventListener(

    "mousedown",

    event => {

      chartDragging = true;

      chartDragStartX =

        event.clientX;

      chartDragStartOffset =

        chartOffset;

      chartCanvas.style.cursor =

        "grabbing";

    }

  );

  chartCanvas.addEventListener(

    "dblclick",

    chartLive

  );

  chartCanvas.style.cursor =

    "grab";

}

window.addEventListener(

  "mousemove",

  event => {

    if (chartDragging) {

      moveChart(

        event.clientX -

        chartDragStartX

      );

    }

  }

);

window.addEventListener(

  "mouseup",

  () => {

    chartDragging = false;

    if (chartCanvas) {

      chartCanvas.style.cursor =

        "grab";

    }

  }

);

/* =========================================================

   MARKET STATUS

   ========================================================= */

function setMarketStatus(

  type,

  text

) {

  const status =

    $("liveStatus");

  const statusText =

    $("liveStatusText");

  if (status) {

    status.className =

      "live " +

      (

        type === "cached"

          ? "cached"

          : type === "error"

            ? "error"

            : ""

      );

  }

  if (statusText) {

    statusText.textContent =

      text;

  }

}

function formatUpdateTime(time) {

  if (!time) {

    return "Not updated yet";

  }

  return (

    "Updated " +

    new Date(time)

      .toLocaleTimeString(

        [],

        {

          hour: "2-digit",

          minute: "2-digit",

          second: "2-digit"

        }

      )

  );

}

/* =========================================================

   LIVE MARKET DATA

   ========================================================= */

async function loadMarket(

  manual = false

) {

  if (marketLoading) {

    return;

  }

  marketLoading = true;

  try {

    if (

      manual ||

      !candles.length

    ) {

      setMarketStatus(

        "live",

        "CONNECTING TO MARKET"

      );

      if ($("dataReceived")) {

        $("dataReceived").textContent =

          "Requesting latest XAU/USD data…";

      }

    }

    const response =

      await fetch(

        "/api/candles?symbol=XAU%2FUSD&interval=5min",

        {

          cache: "no-store"

        }

      );

    let data;

    try {

      data =

        await response.json();

    } catch (error) {

      throw new Error(

        "PriceEdge received an invalid market-data response."

      );

    }

    if (!response.ok) {

      throw new Error(

        data?.error ||

        "Market-data request failed."

      );

    }

    if (

      !Array.isArray(data.values) ||

      !data.values.length

    ) {

      throw new Error(

        "No XAU/USD candle data was returned."

      );

    }

    const clean =

      data.values

        .map(candle => ({

          datetime:

            candle.datetime,

          open:

            Number(candle.open),

          high:

            Number(candle.high),

          low:

            Number(candle.low),

          close:

            Number(candle.close)

        }))

        .filter(candle =>

          candle.datetime &&

          [

            candle.open,

            candle.high,

            candle.low,

            candle.close

          ].every(Number.isFinite)

        );

    if (!clean.length) {

      throw new Error(

        "The market provider returned unusable candle data."

      );

    }

    candles =

      clean.sort(

        (a, b) =>

          new Date(a.datetime) -

          new Date(b.datetime)

      );

    chartOffset = 0;

    lastSuccessfulUpdate =

      Date.now();

    if ($("dataReceived")) {

      $("dataReceived").textContent =

        data.cached

          ? "Latest valid data available"

          : "Live data received";

    }

    if ($("lastUpdated")) {

      $("lastUpdated").textContent =

        formatUpdateTime(

          data.updatedAt ||

          Date.now()

        );

    }

    if (data.cached) {

      setMarketStatus(

        "cached",

        "CACHED MARKET DATA"

      );

      if (data.warning &&

          $("dataReceived")) {

        $("dataReceived").textContent =

          data.warning;

      }

    } else {

      setMarketStatus(

        "live",

        "LIVE MARKET DATA"

      );

    }

    analyze();

  } catch (error) {

    console.error(

      "PriceEdge market error:",

      error

    );

    if (candles.length) {

      setMarketStatus(

        "cached",

        "LAST VALID MARKET DATA"

      );

      if ($("dataReceived")) {

        $("dataReceived").textContent =

          "Latest refresh failed — showing last valid data";

      }

      if ($("lastUpdated")) {

        $("lastUpdated").textContent =

          lastSuccessfulUpdate

            ? formatUpdateTime(

                lastSuccessfulUpdate

              )

            : "Previous data available";

      }

      analyze();

    } else {

      setMarketStatus(

        "error",

        "MARKET DATA UNAVAILABLE"

      );

      if ($("dataReceived")) {

        $("dataReceived").textContent =

          "No valid market data received";

      }

      if ($("lastUpdated")) {

        $("lastUpdated").textContent =

          "Waiting for provider";

      }

      if ($("trendBadge")) {

        $("trendBadge").className =

          "trend-badge error";

        $("trendBadge").textContent =

          "DATA UNAVAILABLE";

      }

      if ($("action")) {

        $("action").className =

          "signal-action action-wait";

        $("action").textContent =

          "WAIT";

      }

      if ($("signalText")) {

        $("signalText").textContent =

          error.message ||

          "Market data is temporarily unavailable.";

      }

      drawChart();

    }

  } finally {

    marketLoading = false;

  }

}

/* =========================================================

   MANUAL REFRESH

   ========================================================= */

function manualRefresh() {

  loadMarket(true);

}

/* =========================================================

   SECURITY

   ========================================================= */

function escapeHtml(value) {

  return String(value ?? "")

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}

/* =========================================================

   START PRICEEDGE

   ========================================================= */

window.addEventListener(

  "resize",

  drawChart

);

updateAccount();

loadTrades();

loadMarket();

setInterval(

  () => loadMarket(false),

  MARKET_REFRESH_MS

);

</script>
