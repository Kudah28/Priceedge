name: PriceEdge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Syntax check core server files
        run: |
          node --check server.js
          node --check analysis-engine.js
          node --check live-patch.js

      - name: Run analysis tests
        run: npm run test:analysis

      - name: Verify required runtime files
        run: |
          test -f server.js
          test -f analysis-engine.js
          test -f live-patch.js
          test -f public/index.html
          test -f package.json
