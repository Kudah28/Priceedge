name: PriceEdge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate package metadata
        run: node -e "const p=require('./package.json'); if(!p.scripts || !p.scripts.start) throw new Error('start script missing'); console.log('PriceEdge package metadata OK')"

      - name: Validate server syntax
        run: node --check server.js

      - name: Validate frontend files
        run: |
          test -f public/index.html
          test -f public/manifest.json
          echo "PriceEdge frontend files OK"
